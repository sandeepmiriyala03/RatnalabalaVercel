<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>రత్నాలబాల – ఆఫ్‌లైన్</title>

  <!-- Cache safety -->
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />

  <style>
    :root {
      --bg: #fafafa;
      --fg: #222;
      --accent: #6200ee;
      --card-bg: #ffffff;
      --shadow: rgba(0, 0, 0, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --fg: #ededed;
        --accent: #bb86fc;
        --card-bg: #121212;
        --shadow: rgba(0, 0, 0, 0.6);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Telugu",
        sans-serif;
    }

    .card {
      max-width: 420px;
      width: 90%;
      padding: 28px 24px;
      text-align: center;
      border-radius: 14px;
      background: var(--card-bg);
      box-shadow: 0 8px 28px var(--shadow);
    }

    .icon {
      font-size: 2.6rem;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.4rem;
      font-weight: 600;
    }

    p {
      margin: 0;
      line-height: 1.7;
      font-size: 0.95rem;
      opacity: 0.88;
    }

    .hint {
      margin-top: 16px;
      font-size: 0.9rem;
      opacity: 0.75;
    }

    .actions {
      margin-top: 22px;
      display: flex;
      justify-content: center;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>
  <div class="card" role="alert" aria-live="polite">
    <div class="icon" aria-hidden="true">📴</div>

    <h1>మీరు ప్రస్తుతం ఆఫ్‌లైన్‌లో ఉన్నారు</h1>

    <p>
      ఇంటర్నెట్ కనెక్షన్ అందుబాటులో లేదు.<br />
      కనెక్షన్ వచ్చిన తర్వాత మళ్లీ ప్రయత్నించండి.
    </p>

    <div class="hint">
      ⚡ మీరు ముందుగా చూసిన పద్యాలు ఆఫ్‌లైన్‌లో అందుబాటులో ఉండవచ్చు
    </div>

    <div class="actions">
      <button onclick="location.reload()">
        🔄 మళ్లీ ప్రయత్నించండి
      </button>
    </div>
  </div>
</body>
</html>
