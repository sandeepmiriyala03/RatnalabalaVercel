name: Build Android AAB (TWA)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build TWA Android AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Android SDK tools
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64

      - name: Install npm dependencies
        run: |
          npm ci --prefer-offline || npm install --no-audit

      - name: Initialize Bubblewrap TWA (non-interactive)
        env:
          APP_ID: com.ratnalabala.app
          APP_NAME: Ratnalabala
        run: |
          npx @bubblewrap/cli init --manifest=https://ratnalabala.vercel.app/manifest.json --applicationId=$APP_ID --applicationName="$APP_NAME" --outputDirectory=twa || true

      - name: Build Android (Gradle)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          # If Bubblewrap created a twa directory, build inside it; otherwise try a generic gradle build
          if [ -d "twa" ]; then
            cd twa
            # Place keystore if provided as secret
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            fi
            npx @bubblewrap/cli build --release
            # Gradle output (AAB) usually under android/app/build/outputs/bundle/release
            ls -R android || true
          else
            echo "twa directory not found; Bubblewrap init may have failed." >&2
            exit 1
          fi

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twa-aab
          path: |
            twa/android/app/build/outputs/bundle/release/*.aab
            twa/android/app/build/outputs/apk/release/*.apk
